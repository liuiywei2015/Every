<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <script src="client-detect.js"></script><meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <script src="guard.js"></script>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="bike.css">
  <title data-i18n="title.bike">单车 - Cealin</title>
<link rel="stylesheet" href="ui.css">
</head>
<body class="bike-page">

<div class="game-shell" id="gameShell" data-mode="menu">
  <canvas id="bikeCanvas"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <!-- 左上角：小房子（退出全屏并回站点主页） -->
  <div class="corner tl">
    <button type="button" class="home-btn" id="btnHome" title="返回首页" data-i18n-title="bike.home">
      <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true"><path d="M12 3.1 2.6 10.6h2.8V21h5.2v-5.5h2.8V21h5.2V10.6h2.8z" fill="currentColor"/></svg>
    </button>
    <span class="brand-chip">CEALIN <em>RIDE</em></span>
  </div>

  <!-- 右上角：全屏切换 -->
  <div class="corner tr">
    <button type="button" class="icon-btn" id="btnFull" title="全屏" data-i18n-title="bike.fullscreen">
      <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M4 9V4h5v2H6v3zm11-5h5v5h-2V6h-3zM4 15h2v3h3v2H4zm16 0v5h-5v-2h3v-3z" fill="currentColor"/></svg>
    </button>
  </div>

  <!-- 游戏内主菜单 -->
  <div class="menu-layer" id="menuLayer">
    <div class="menu-head">
      <h1 class="menu-title" data-i18n="bike.menuTitle">速降</h1>
      <p class="menu-sub" data-i18n="bike.menuSub">黄昏山林 · 单人速降</p>
    </div>
    <nav class="side-menu" id="sideMenu">
      <button type="button" class="menu-btn primary" data-act="ride"><span data-i18n="bike.menuRide">开始骑行</span><i aria-hidden="true">›</i></button>
      <button type="button" class="menu-btn" data-act="garage"><span data-i18n="bike.menuGarage">我的车库</span><i aria-hidden="true">›</i></button>
      <button type="button" class="menu-btn" data-act="track"><span data-i18n="bike.menuTrack">选择赛道</span><i aria-hidden="true">›</i></button>
      <button type="button" class="menu-btn" data-act="board"><span data-i18n="bike.menuBoard">排行榜</span><i aria-hidden="true">›</i></button>
      <button type="button" class="menu-btn" data-act="replay"><span data-i18n="bike.menuReplay">回放</span><i aria-hidden="true">›</i></button>
      <button type="button" class="menu-btn" data-act="help"><span data-i18n="bike.menuHelp">操作</span><i aria-hidden="true">›</i></button>
      <button type="button" class="menu-btn" data-act="settings"><span data-i18n="bike.menuSettings">设置</span><i aria-hidden="true">›</i></button>
    </nav>
    <div class="menu-foot">
      <span class="mf-item"><b data-i18n="bike.best">最佳用时</b><span id="menuBestTime">--:--</span></span>
      <span class="mf-item"><b data-i18n="bike.trick">特技分</b><span id="menuBestTrick">0</span></span>
      <span class="mf-item"><b data-i18n="bike.menuTrack">赛道</b><span id="menuMap">黄昏林道</span></span>
    </div>
  </div>

  <!-- 主菜单子面板 -->
  <div class="panel-layer hide" id="panelLayer">
    <div class="panel-card">
      <div class="panel-top">
        <button type="button" class="icon-btn ghost" id="btnPanelBack" title="返回" data-i18n-title="bike.back">&#8592;</button>
        <h2 class="panel-title" id="panelTitle"></h2>
      </div>
      <div class="panel-body" id="panelBody"></div>
    </div>
  </div>

  <!-- 游戏 HUD -->
  <div class="hud" id="hudBar">
    <div class="hud-chip"><span class="hud-label" data-i18n="bike.time">用时</span><span class="hud-value gold" id="hudTime">0:00.00</span></div>
    <div class="hud-chip"><span class="hud-label" data-i18n="bike.best">最佳用时</span><span class="hud-value" id="hudBest">--:--</span></div>
    <div class="hud-chip"><span class="hud-label" data-i18n="bike.speed">速度</span><span class="hud-value" id="hudSpeed">0 km/h</span></div>
    <div class="hud-chip"><span class="hud-label" data-i18n="bike.dist">里程</span><span class="hud-value" id="hudDist">0 / 1032 m</span></div>
    <div class="hud-chip"><span class="hud-label" data-i18n="bike.trick">特技分</span><span class="hud-value" id="hudTrick">0</span></div>
    <div class="hud-chip"><span class="hud-label" data-i18n="bike.wheelieBest">最长后轮</span><span class="hud-value" id="hudWheelie">--</span></div>
    <div class="hud-chip"><span class="hud-label" data-i18n="bike.crashCount">摔倒</span><span class="hud-value" id="hudCrash">0</span></div>
    <div class="hud-chip"><span class="hud-label" data-i18n="bike.cp">检查点</span><span class="hud-value" id="hudCp">0 / 5</span></div>
    <div class="hud-chip"><span class="hud-label" data-i18n="bike.surf">路面</span><span class="hud-value" id="hudSurf">泥地</span></div>
  </div>
  <div class="progress"><i id="hudProgress"></i></div>

  <!-- Wheelie 计时 -->
  <div class="wheelie-hud hide" id="wheelieHud">
    <span class="wh-label" data-i18n="bike.wheelie">后轮滑行</span>
    <span class="wh-time" id="wheelieTime">0.0s</span>
    <span class="wh-pts" id="wheeliePts">+0</span>
  </div>

  <div class="toast hide" id="bikeToast"></div>

  <!-- 暂停 / 终点覆盖层 -->
  <div class="overlay hide" id="bikeOverlay">
    <div class="overlay-card">
      <h2 class="overlay-title" id="ovTitle">已暂停</h2>
      <p class="overlay-desc" id="ovDesc"></p>
      <div class="overlay-stats" id="ovStats"></div>
      <div class="overlay-actions">
        <button type="button" class="btn primary" id="ovBtn" data-i18n="bike.resume">继续</button>
        <button type="button" class="btn" id="ovMenu" data-i18n="bike.backToMenu">返回主菜单</button>
      </div>
    </div>
  </div>

  <!-- 触屏俯仰 / 油门刹车 -->
  <div class="touchpad" id="touchpad">
    <div class="tpad-side tpad-left">
      <button type="button" class="tbtn steer" id="tSteerL" data-i18n="bike.tSteerL">左转</button>
      <button type="button" class="tbtn steer" id="tSteerR" data-i18n="bike.tSteerR">右转</button>
      <button type="button" class="tbtn" id="tLeanB" data-i18n="bike.tLeanB">后仰</button>
      <button type="button" class="tbtn" id="tLeanF" data-i18n="bike.tLeanF">前倾</button>
    </div>
    <div class="tpad-side tpad-right">
      <button type="button" class="tbtn jump" id="tJump" data-i18n="bike.tJump">兔跳</button>
      <button type="button" class="tbtn" id="tBrake" data-i18n="bike.tBrake">刹车</button>
      <button type="button" class="tbtn acc" id="tGas" data-i18n="bike.tGas">油门</button>
    </div>
  </div>

  <!-- 骑行中的按钮 -->
  <div class="ingame-actions">
    <button type="button" class="btn small" id="btnPause" data-i18n="bike.pause">暂停</button>
    <button type="button" class="btn small" id="btnRestart" data-i18n="bike.restart">重新开始</button>
  </div>

  <p class="ingame-hint" data-i18n="bike.hint">W 油门 / S 刹车 / ↑ 前倾 / ↓ 后仰抬前轮 / A D 或 ← → 转向与空中旋转 / 空格 兔跳 / R 复位 / Esc 暂停</p>
</div>

<script src="vendor/three.min.js"></script>
<script src="i18n.js"></script>
<script src="bike.js"></script>
<script src="nav.js"></script>
</body>
</html>
